    if(!rep.n) return toast('제출된 평가가 없어 공개할 내용이 없어요.',true);
    if(!await saveReportDraft()) return;
    await run(()=>S.db.doc('cfg/root/reports/'+r.sid).set({...rep,publishedAt:nowISO()}),'학생들에게 리포트를 공개했어요.');
  },
  async reportUnpublish(){ const sid=S.reportDraft.sid; await run(()=>S.db.doc('cfg/root/reports/'+sid).delete(),'공개를 취소했어요.'); },
  reportStop(){ S.aiCtl?.abort(); },
  async reportAI(){
    const sample=C?await C.use('sample'):null;
    if(!sample) return toast('이 화면에서는 AI 요약을 쓸 수 없어요. 직접 작성해 주세요.',true);
    const r=S.reportDraft; const rep=buildReport(r.sid,{...r,includeComments:true});
    if(!rep||!rep.n) return toast('아직 제출된 평가가 없어요.',true);
    const data={발표:rep.title,주제:rep.topic,평가참여:rep.n,
      내용구성:{기준:rep.content.map(c=>({기준:c.name,평균:f1(c.avg),만점:c.max})),근거:rep.contentComments.slice(0,40).map(t=>t.slice(0,400))},
      발표자:rep.speakers.map(s=>({id:s.id,이름:s.name,기준:s.crits.map(c=>({기준:c.name,평균:f1(c.avg),만점:c.max})),근거:s.comments.slice(0,30).map(t=>t.slice(0,400))}))};
    const prompt=`당신은 중학교 영어 교사를 돕는 조수입니다. 아래는 학생들이 한 모둠의 영어 발표를 동료 평가한 결과(평균 점수와 익명 근거)입니다. 학생들에게 보여 줄 종합 피드백을 한국어로 작성하세요.
규칙:
- 중학생이 이해하기 쉬운 따뜻하고 존중하는 해요체로 씁니다.
- 각 피드백은 "잘한 점:"과 "더 나아지려면:" 두 줄로, 각각 1~3문장입니다. 여러 친구가 공통으로 말한 내용을 우선 반영하고 구체적인 행동을 제안합니다.
- 평가한 학생을 짐작할 수 있는 표현, 비꼬거나 공격적인 표현, 비속어는 쓰지 않습니다. 근거 중 공격적인 의견은 무시합니다.
- 점수 숫자를 나열하지 말고 의미로 풀어 씁니다.
- group은 모둠의 내용·구성(PPT 포함) 피드백, speakers는 각 발표자의 발표(speaking: 발음, 전달력, 태도 등) 피드백입니다.
출력: 다른 말 없이 JSON 하나만. 형식: {"group":"잘한 점: ...\\n더 나아지려면: ...","speakers":{"<발표자 id>":"잘한 점: ...\\n더 나아지려면: ..."}}
데이터:
${JSON.stringify(data)}`;
    S.aiBusy=true; S.aiCtl=new AbortController(); render();
    try{
      const out=await sample.json(prompt,{signal:S.aiCtl.signal,cache:false});
      if(S.reportDraft&&S.reportDraft.sid===r.sid&&out&&typeof out==='object'){
        if(typeof out.group==='string') S.reportDraft.groupSummary=out.group;
        if(out.speakers&&typeof out.speakers==='object') for(const [k,v] of Object.entries(out.speakers)) if(typeof v==='string') S.reportDraft.speakerSummaries[k]=v;
        S.reportDraft.dirty=true; toast('초안을 채웠어요. 읽어 보고 고친 뒤 공개해 주세요.');
      }
    }catch(e){
      const c=e&&e.code;
      if(c==='cancelled'){} else if(c==='not_granted'||c==='sampling_disabled') toast('AI 사용이 허용되지 않았어요. 직접 작성해 주세요.',true);
      else if(c==='rate_limited') toast('AI 사용량이 많아요. 잠시 뒤 다시 눌러 주세요.',true);
      else if(c==='invalid_json') toast('AI 답을 읽지 못했어요. 한 번 더 눌러 주세요.',true);
      else toast('AI 요약을 만들지 못했어요. 잠시 뒤 다시 시도해 주세요.',true);
    }finally{ S.aiBusy=false; S.aiCtl=null; render(); }
  },
  // student
  sPickClass(el){ S.view={name:'sclass',cid:el.dataset.id}; if(!S.preview) lsSet('pr_class',el.dataset.id); S.profileDraft=null; render(); },
  sChangeClass(){ if(!S.preview) lsSet('pr_class',null); S.view={name:'shome'}; S.profileDraft=null; render(); },
  sEditProfile(){ const cid=S.view.cid, p=myProfile(cid); S.profileDraft={cid,open:true,number:p?.number||'',name:p?.name||'',myGroup:p?.myGroup||'',dirty:false}; render(); },
  sCancelProfile(){ S.profileDraft=null; render(); },
  async sSaveProfile(){
    const p=S.profileDraft, cid=S.view.cid;
    if(!String(p.name).trim()) return toast('이름을 입력해 주세요.',true);
    const ok=await saveMy(doc=>{ doc.byClass=doc.byClass||{}; const cur=doc.byClass[cid]||{items:{}}; doc.byClass[cid]={...cur,number:String(p.number||'').trim(),name:String(p.name).trim(),myGroup:p.myGroup||''}; },'저장했어요.');
    if(ok){ S.profileDraft=null; render(); }
  },
  sOpenEval(el){ S.view={name:'eval',sid:el.dataset.id,cid:S.view.cid}; S.evalDraft=null; render(); window.scrollTo(0,0); },
  sCancelEval(){ S.view={name:'sclass',cid:S.sessions[S.view.sid]?.classId||S.view.cid}; S.evalDraft=null; render(); },
  async sSubmitEval(){
    const sid=S.view.sid, sess=S.sessions[sid];
    if(!sess||sess.status!=='open') return toast('평가가 마감되어 제출할 수 없어요.',true);
    const pg=evalProgress(); S.evalTried=true;
    if(pg.missing.length){ render(); toast(`${pg.missing.length}개 항목을 더 채워 주세요.`,true); return; }
    const d=clone(S.evalDraft); const cid=sess.classId;
    const ok=await saveMy(doc=>{ doc.byClass=doc.byClass||{}; const cur=doc.byClass[cid]||{}; cur.items=cur.items||{}; cur.items[sid]={content:d.content,speaking:d.speaking,contentReason:d.contentReason.trim(),speakerReasons:d.speakerReasons,at:nowISO()}; doc.byClass[cid]=cur; }, S.preview?'미리보기라 저장되지 않았어요.':'제출했어요! 마감 전까지는 고칠 수 있어요.');
    if(ok){ S.view={name:'sclass',cid}; S.evalDraft=null; render(); window.scrollTo(0,0); }
  },
  sOpenReport(el){ S.view={name:'report',sid:el.dataset.id,cid:S.view.cid}; render(); window.scrollTo(0,0); },
  sBack(){ S.view={name:'sclass',cid:S.sessions[S.view.sid]?.classId||S.view.cid}; render(); }
};
function resetDrafts(){ S.rosterDraft=null; S.rubricDraft=null; S.sessionForm=null; S.evalDraft=null; S.profileDraft=null; S.reportDraft=null; S.confirm=null; S.renaming=false; }
async function removeItems(cid, sid, onlyUid){
  for(const [uid,d] of Object.entries(S.evals)){
    if(onlyUid&&!String(onlyUid).split(',').includes(uid)) continue;
    if(!(d.byClass&&d.byClass[cid]&&d.byClass[cid].items&&d.byClass[cid].items[sid])) continue;
    const ref=S.db.doc('evals/'+uid); const snap=await ref.get(); if(!snap.exists) continue;
    const nd=clone(snap.data()); if(nd.byClass&&nd.byClass[cid]&&nd.byClass[cid].items){ delete nd.byClass[cid].items[sid]; nd.updatedAt=nowISO(); await ref.set(nd); }
  }
}
async function saveReportDraft(msg){
  const r=S.reportDraft; const sess=S.sessions[r.sid];
  const ok=await run(()=>S.db.doc('drafts/root/reports/'+r.sid).set({sid:r.sid,classId:sess.classId,groupSummary:r.groupSummary,speakerSummaries:r.speakerSummaries,includeComments:r.includeComments,updatedAt:nowISO()}),msg);
  if(ok) r.dirty=false; return ok;
}
async function saveMy(mut, okMsg){
  if(S.preview){ mut(S.previewDoc); toast(okMsg); return true; }
  return run(async()=>{
    const ref=S.db.doc('evals/'+S.uid); const snap=await ref.get();
    const doc=snap.exists?clone(snap.data()):{byClass:{}};
    mut(doc); doc.updatedAt=nowISO(); await ref.set(doc); S.myDoc=doc;
  }, okMsg);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=A[el.dataset.act]; if(fn){ e.preventDefault(); fn(el); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.actChange){ A[t.dataset.actChange]?.(t); return; }
  if(t.dataset.ev!==undefined){ setEval(t.dataset.ev,'score',Number(t.value)); return; }
  if(t.dataset.rb){ const [k,i,f]=t.dataset.rb.split('|'); const c=S.rubricDraft.rubric[k][+i];
    if(f==='max'||f==='min'){ c[f]=t.value; normCrit(c); S.rubricDraft.dirty=true; render(); }
    else if(f==='step'){ if(t.value==='custom'){ c.steps=scoresOf(c); c.step='custom'; } else { c.step=t.value; c.steps=null; } normCrit(c); S.rubricDraft.dirty=true; render(); }
    return; }
  if(t.dataset.rbs){ const [k,i,old]=t.dataset.rbs.split('|'); const c=S.rubricDraft.rubric[k][+i]; const nv=parseInt(t.value,10);
    if(isNaN(nv)||nv<0||nv>100){ toast('점수는 0~100 사이 숫자로 적어 주세요.',true); render(); return; }
    if(nv!==+old && c.steps.includes(nv)){ toast(`${nv}점 단계가 이미 있어요.`,true); render(); return; }
    c.levels[nv]=c.levels[old]; if(nv!==+old) delete c.levels[old]; c.steps=c.steps.map(x=>x===+old?nv:x); normCrit(c); S.rubricDraft.dirty=true; render(); return; }
  if(t.dataset.ff==='filterOn'){ S.rubricDraft.filterOn=t.checked; markRubricDirty(); return; }
  if(t.dataset.sfCount!==undefined){ const n=+t.value; const sp=S.sessionForm.speakers; while(sp.length<n) sp.push({id:gid('p'),name:''}); sp.length=n; render(); return; }
  if(t.dataset.pf==='myGroup'){ S.profileDraft.myGroup=t.value; S.profileDraft.dirty=true; return; }
  if(t.dataset.rp==='inc'){ S.reportDraft.includeComments=t.checked; S.reportDraft.dirty=true; updateLive(); return; }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.evr!==undefined){ const p=t.dataset.evr.split('|'); if(p[0]==='c') S.evalDraft.contentReason=t.value; else S.evalDraft.speakerReasons[p[1]]=t.value; setEval(null); return; }
  if(t.dataset.rb){ const [k,i,f]=t.dataset.rb.split('|'); if(f==='name'){ S.rubricDraft.rubric[k][+i].name=t.value; markRubricDirty(); } return; }
  if(t.dataset.rbl){ const [k,i,s]=t.dataset.rbl.split('|'); S.rubricDraft.rubric[k][+i].levels[s]=t.value; markRubricDirty(); return; }
  if(t.dataset.ff==='banned'){ S.rubricDraft.bannedText=t.value; markRubricDirty(); return; }
  if(t.dataset.roster!==undefined){ S.rosterDraft.text=t.value; return; }
  if(t.dataset.sf){ S.sessionForm[t.dataset.sf]=t.value; return; }
  if(t.dataset.sfSp!==undefined){ S.sessionForm.speakers[+t.dataset.sfSp].name=t.value; return; }
  if(t.dataset.sfNo!==undefined){ S.sessionForm.speakers[+t.dataset.sfNo].number=t.value; return; }
  if(t.dataset.pf){ S.profileDraft[t.dataset.pf]=t.value; S.profileDraft.dirty=true; return; }
  if(t.dataset.rp){ const r=S.reportDraft; if(t.dataset.rp==='group') r.groupSummary=t.value; else { const id=t.dataset.rp.split('|')[1]; r.speakerSummaries[id]=t.value; } r.dirty=true; updateLive(); return; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='newClassName') A.createClass(); if(e.key==='Enter'&&e.target.id==='renameInput') A.renameSave(); });
function markRubricDirty(){ if(!S.rubricDraft.dirty){ S.rubricDraft.dirty=true; const sb=$('.savebar'); if(sb){ sb.querySelector('.grow').textContent='저장하지 않은 변경 사항이 있어요.'; sb.querySelector('[data-act=resetRubric]').disabled=false; } } }
function setEval(path,field,val){
  const d=S.evalDraft;
  if(path){ const p=path.split('|');
    let o; if(p[0]==='c'){ o=d.content[p[1]]=d.content[p[1]]||{}; } else { d.speaking[p[1]]=d.speaking[p[1]]||{}; o=d.speaking[p[1]][p[2]]=d.speaking[p[1]][p[2]]||{}; }
    o[field]=val; }
  const pg=evalProgress(); const tx=$('#evProgTxt'); if(tx) tx.textContent=`${pg.done} / ${pg.total} 항목 완료`; const b=$('#evProgBar'); if(b) b.style.width=(pg.total?pg.done/pg.total*100:0)+'%';
  if(S.evalTried){ const er=$('#evErr'); if(er) er.textContent=pg.missing.length?`아직 덜 채운 항목: ${pg.missing.join(', ')} (종합 의견은 ${REASON_MIN}자 이상)`:''; }
}

/* ---------- boot ---------- */
function applyHash(){
  const h=String((S.loc&&S.loc.parameter&&S.loc.parameter['class'])||'');
  if(!h||!S.classes[h]) return false;
  resetDrafts();
  if(S.teacher&&!S.preview) S.view={name:'class',cid:h,tab:'sessions'};
  else { S.view={name:'sclass',cid:h}; if(!S.preview) lsSet('pr_class',h); }
  return true;
}
window.addEventListener('hashchange',()=>{ if(S.ready&&applyHash()) render(); });
function mapSnap(snap){ const o={}; snap.docs.forEach(d=>{ const v=d.data(); if(v) o[d.id]={...v,id:v.id||d.id}; }); return o; }
function sub(ref, set){ return ref.onSnapshot(s=>{ set(s); onData(); }, e=>{ console.warn(e); if(e&&e.code==='revoked'){ S.err='이 페이지에 대한 접근 권한이 바뀌었어요. 새로고침해 주세요.'; render(); } }); }
function roleHTML(){
  return `<main class="wrap narrow">
    <section class="stack" style="text-align:center;gap:6px;padding-top:12px"><h1>누구신가요?</h1><p class="muted">알맞은 쪽을 눌러 시작해 주세요.</p></section>
    <div class="roles">
      <button class="rolecard r-stu" data-act="chooseStudent"><span class="ico" aria-hidden="true">🙋</span><strong>학생</strong><span class="muted small">친구들의 발표를 평가하고<br>피드백 리포트를 봐요</span></button>
      <button class="rolecard r-tch" data-act="chooseTeacher"><span class="ico" aria-hidden="true">🧑‍🏫</span><strong>교사</strong><span class="muted small">평가 기준·대시보드·리포트를<br>관리해요 (비밀번호 필요)</span></button>
    </div>
  </main>`;
}
function loginHTML(){
  return `<main class="wrap narrow"><section class="card stack login">
    <span class="eyebrow">교사 로그인</span><h1>선생님 비밀번호를 입력해 주세요</h1>
    ${S.passwordSet===false?`<div class="note">아직 비밀번호가 설정되지 않았어요. Render의 Environment 설정에서 TEACHER_PASSWORD를 추가해 주세요.</div>`:''}
    <form id="loginForm" class="row wrapr" autocomplete="off"><input type="password" id="pw" placeholder="비밀번호" style="flex:1 1 200px" autocomplete="current-password"><button class="btn primary" type="submit">로그인</button></form>
    <p class="muted small">학생은 선생님이 보낸 학생용 링크로 들어오면 돼요.</p>
    <button class="btn ghost sm" data-act="backToRole" style="align-self:flex-start">← 처음 화면으로</button>
  </section></main>`;
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm') return; e.preventDefault();
  const pw=$('#pw').value; if(!pw) return;
  try{ const r=await apiCall('login',{password:pw}); AUTH.t=r.token; LS.set('pr_t',r.token); S.teacher=true; startApp(); }
  catch(err){ toast(err.code==='wrong_password'?'비밀번호가 맞지 않아요.':err.code==='not_configured'?'Render에서 TEACHER_PASSWORD를 먼저 설정해 주세요.':'로그인하지 못했어요. 잠시 뒤 다시 시도해 주세요.',true); }
});
Object.assign(A,{
  chooseStudent(){ LS.set('pr_role','student'); S.roleView=false; startApp(); },
  chooseTeacher(){ S.roleView=false; S.loginView=true; render(); setTimeout(()=>$('#pw')&&$('#pw').focus(),0); },
  backToRole(){ S.loginView=false; S.roleView=true; render(); },
  toRoleScreen(){ LS.set('pr_role',null); if(S.db) S.db.stop(); S.db=null; S.ready=false; S.myDoc=null;
    S.classes={};S.sessions={};S.pubReports={}; resetDrafts(); S.view={name:'home'}; S.roleView=true; render(); },
  teacherLogout(){ AUTH.t=null; LS.set('pr_t',null); if(S.db) S.db.stop(); S.db=null; S.teacher=false; S.preview=false; S.ready=false;
    S.classes={};S.sessions={};S.pubReports={};S.drafts={};S.mods={};S.evals={}; resetDrafts(); S.view={name:'home'}; S.roleView=true; render(); },
  copyTeacher(){ copyText(teacherLink(),'#teacherLink','교사용 주소를 복사했어요.'); },
  copyLink(el){ copyText(linkFor(el.dataset.id),'#shareLink','학생용 링크를 복사했어요.'); },
  sSwitchDo(){ S.confirm=null; const d=newDeviceId(); LS.set('pr_d',d); AUTH.d=d; S.uid=d; S.myDoc=null; S.profileDraft=null; S.evalDraft=null;
    if(S.myUnsub) S.myUnsub(); S.myUnsub=sub(S.db.doc('evals/'+S.uid), x=>{ S.myDoc=x.exists?clone(x.data()):null; });
    S.view={name:'sclass',cid:S.view.cid}; render(); toast('새 학생으로 시작해요. 번호와 이름을 적어 주세요.'); }
});
function copyText(text, inputSel, ok){
  const fallback=()=>{ const i=$(inputSel); if(i&&i.value===text){ i.focus(); i.select(); toast('주소를 선택했어요. Ctrl+C(⌘+C)로 복사해 주세요.'); } else { toast('복사하지 못했어요. 반을 열어 링크 칸에서 직접 복사해 주세요.',true); } };
  try{ const p=navigator.clipboard&&navigator.clipboard.writeText(text); if(p) p.then(()=>toast(ok),fallback); else fallback(); }catch(e){ fallback(); }
}
function startApp(){
  S.loginView=false; S.ready=false; S.canWrite=true;
  if(!S.teacher){ AUTH.d=deviceId(); S.uid=AUTH.d; }
  const db=makeDB(); S.db=db;
  let pending=3; const done=()=>{ if(--pending<=0&&!S.ready){ S.ready=true; applyHash(); render(); } };
  const first={a:1,b:1,c:1};
  sub(db.collection('cfg/root/classes'), x=>{ S.classes=mapSnap(x); if(first.a){first.a=0;done();} });
  sub(db.collection('cfg/root/sessions'), x=>{ S.sessions=mapSnap(x); if(first.b){first.b=0;done();} });
  sub(db.collection('cfg/root/reports'), x=>{ S.pubReports=mapSnap(x); if(first.c){first.c=0;done();} });
  if(S.teacher){
    sub(db.collection('drafts/root/reports'), x=>{ S.drafts=mapSnap(x); });
    sub(db.collection('drafts/root/mod'), x=>{ S.mods=mapSnap(x); });
    sub(db.collection('evals'), x=>{ S.evals=mapSnap(x); });
  } else {
    S.myUnsub=sub(db.doc('evals/'+S.uid), x=>{ S.myDoc=x.exists?clone(x.data()):null; });
  }
  render();
  setTimeout(()=>{ if(!S.ready&&!S.loginView){ S.ready=true; applyHash(); render(); } }, 15000);
}
(async()=>{
  S.loc={parameter:Object.fromEntries(new URLSearchParams(location.search))};
  let info; try{ info=await apiCall('info',{}); }catch(e){ S.err='서버에 연결하지 못했어요. 무료 서버가 잠들어 있으면 깨어나는 데 1분쯤 걸려요. 잠시 뒤 새로고침해 주세요.'; render(); return; }
  SHARE_URL=location.origin+'/'; S.storeKind=info.store; S.passwordSet=info.passwordSet;
  if(!info.teacher&&AUTH.t){ AUTH.t=null; LS.set('pr_t',null); }
  S.teacher=!!info.teacher;
  if(!S.teacher){
    const prm=(S.loc&&S.loc.parameter)||{};
    if(prm.mode==='teacher'){ S.loginView=true; render(); return; }
    if(!prm['class'] && LS.get('pr_role')!=='student'){ S.roleView=true; render(); return; }
  }
  startApp();
})();
