services:
  - type: web
    name: peer-review-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: TEACHER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: peer-review-db
          property: connectionString

databases:
  - name: peer-review-db
    plan: free
    ipAllowList: []
